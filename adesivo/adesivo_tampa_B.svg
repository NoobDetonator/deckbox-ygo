<rect class="corte" x="68.800" y="82.500" width="68.600" height="75.600" rx="2.500" ry="2.500"/></g>
<g inkscape:groupmode="layer" inkscape:label="Textos" id="textos"><text class="n" x="11.000" y="27.500" text-anchor="end">1</text>
<text class="n" x="11.000" y="78.000" text-anchor="end">2</text>
<text class="s" x="12.000" y="71.500">começo: meio da traseira (fica por baixo)</text>
<text class="s" x="12.000" y="122.000">parte 2: cole por último;</text>
<text class="s" x="12.000" y="125.000">as pontas passam 5 mm por cima da parte 1</text>
<text class="t" x="151.4" y="86.5">Faixa: contorno 293.5 mm × 32.5 mm de altura, em 2 partes</text>
<text class="t" x="151.4" y="91.5">Topo: 68.6 × 75.6 mm, cantos R2.5</text>
<text class="t" x="151.4" y="96.5">Vermelho = corte · Azul tracejado = sangria (estenda a arte até ela)</text>
<text class="t" x="151.4" y="101.5">Verde tracejado = área segura · Cinza = cantos arredondados</text>
<text class="t" x="151.4" y="106.5">Recorte embaixo, na traseira = espaço da dobradiça (57.4 × 25.0 mm)</text>
<text class="t" x="151.4" y="111.5">Aplicar: topo primeiro; depois a faixa, começando no meio da</text>
<text class="t" x="151.4" y="116.5">traseira, com a borda de cima logo abaixo do chanfro do topo.</text>
<text class="t" x="151.4" y="121.5">Use vinil adesivo (fosco ou brilho) e, se possível, laminação.</text>
<line x1="151.4" y1="132.5" x2="201.4" y2="132.5" stroke="#000" stroke-width="0.3"/>
<line x1="151.4" y1="130.5" x2="151.4" y2="132.5" stroke="#000" stroke-width="0.2"/>
<line x1="161.4" y1="131.3" x2="161.4" y2="132.5" stroke="#000" stroke-width="0.2"/>
<line x1="171.4" y1="131.3" x2="171.4" y2="132.5" stroke="#000" stroke-width="0.2"/>
<line x1="181.4" y1="131.3" x2="181.4" y2="132.5" stroke="#000" stroke-width="0.2"/>
<line x1="191.4" y1="131.3" x2="191.4" y2="132.5" stroke="#000" stroke-width="0.2"/>
<line x1="201.4" y1="130.5" x2="201.4" y2="132.5" stroke="#000" stroke-width="0.2"/>
<text class="t" x="204.4" y="133.5">50 mm — confira com uma régua</text>
<text class="h" x="12" y="14">Adesivo da tampa — versão B (dobradiça colada)</text>
<text class="t" x="12" y="20">Imprima em TAMANHO REAL (100 %, sem "ajustar à página") e confira a régua de 50 mm.</text></g>
</svg>