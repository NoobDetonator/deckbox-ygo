<rect class="sobre" x="12.000" y="82.500" width="5.000" height="32.500"/>
<text class="f" x="103.100" y="120.300">TOPO</text>
<text class="f" x="103.100" y="163.600">FRENTE (este lado vai para a frente)</text></g>
<g inkscape:groupmode="layer" inkscape:label="Corte" id="corte"><path class="corte" d="M12.000,33.000 A1.000,1.000 0 0 1 13.000,32.000 L272.733,32.000 A1.000,1.000 0 0 1 273.733,33.000 L273.733,63.500 A1.000,1.000 0 0 1 272.733,64.500 L41.700,64.500 A1.000,1.000 0 0 1 40.700,63.500 L40.700,40.500 A1.000,1.000 0 0 0 39.700,39.500 L13.000,39.500 A1.000,1.000 0 0 1 12.000,38.500 Z"/>
