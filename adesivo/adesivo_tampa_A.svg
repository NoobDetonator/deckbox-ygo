<g inkscape:groupmode="layer" inkscape:label="Textos" id="textos">
<text class="h" x="12" y="14">Adesivo da tampa — versão A (dobradiça integrada)</text>
<text class="t" x="12" y="20">Imprima em TAMANHO REAL (100 %, sem "ajustar à página") e confira a régua de 50 mm.</text>
<text class="t" x="100" y="82.5">Faixa: 272.5 × 28.5 mm (contorno 267.5 + 5 de sobreposição)</text>
<text class="t" x="100" y="87.5">Topo: 66.6 × 64.6 mm, cantos R2.5</text>
<text class="t" x="100" y="92.5">Vermelho = corte · Azul tracejado = sangria (estenda a arte até ela)</text>
<text class="t" x="100" y="97.5">Verde tracejado = área segura · Cinza = começo e fim dos cantos arredondados</text>
<text class="t" x="100" y="102.5">Recorte embaixo, na traseira = espaço da dobradiça (61.6 × 4.4 mm)</text>
<text class="t" x="100" y="107.5">Aplicar: comece no meio da traseira, com a borda de cima logo abaixo</text>
<text class="t" x="100" y="112.5">do chanfro do topo, e dê a volta; o fim passa por cima do começo.</text>
<text class="t" x="100" y="117.5">Use vinil adesivo (fosco ou brilho) e, se possível, laminação por cima.</text>
<line x1="100" y1="128.5" x2="150" y2="128.5" stroke="#000" stroke-width="0.3"/>
<line x1="100" y1="126.5" x2="100" y2="128.5" stroke="#000" stroke-width="0.2"/>
