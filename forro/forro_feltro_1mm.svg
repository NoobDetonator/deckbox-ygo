<line x1="194.0" y1="175.0" x2="194.0" y2="176.2" stroke="#000" stroke-width="0.2"/>
<line x1="204.0" y1="174.2" x2="204.0" y2="176.2" stroke="#000" stroke-width="0.2"/>
<text class="t" x="207.0" y="177.2">50 mm — confira com uma régua</text>
<text class="h" x="12" y="14">Forro interno — feltro adesivo de 1 mm</text>
<text class="t" x="12" y="20">Imprima em TAMANHO REAL (100 %, sem "ajustar à página"), recorte as peças e use como molde no tecido.</text></g>
</svg>