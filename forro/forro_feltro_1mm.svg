<g inkscape:groupmode="layer" inkscape:label="Textos" id="textos"><text class="p" x="44.80" y="58.75">CORPO frente/traseira</text>
<text class="q" x="44.80" y="62.75">65.6 × 65.5 mm · 2º: largura toda</text>
<text class="p" x="113.40" y="58.75">CORPO frente/traseira</text>
<text class="q" x="113.40" y="62.75">65.6 × 65.5 mm · 2º: largura toda</text>
<text class="p" x="181.40" y="58.75">CORPO lateral</text>
<text class="q" x="181.40" y="62.75">64.4 × 65.5 mm · 3º: entre frente e traseira</text>
<text class="p" x="248.80" y="58.75">CORPO lateral</text>
<text class="q" x="248.80" y="62.75">64.4 × 65.5 mm · 3º: entre frente e traseira</text>
<text class="p" x="44.80" y="111.35">TAMPA frente/traseira</text>
<text class="q" x="44.80" y="115.35">65.6 × 25.7 mm · 2º: largura toda</text>
<text class="p" x="113.40" y="111.35">TAMPA frente/traseira</text>
<text class="q" x="113.40" y="115.35">65.6 × 25.7 mm · 2º: largura toda</text>
<text class="p" x="181.40" y="111.35">TAMPA lateral</text>
<text class="q" x="181.40" y="115.35">64.4 × 25.7 mm · 3º: entre frente e traseira</text>
<text class="p" x="248.80" y="111.35">TAMPA lateral</text>
<text class="q" x="248.80" y="115.35">64.4 × 25.7 mm · 3º: entre frente e traseira</text>
<text class="p" x="44.00" y="163.60">FUNDO</text>
<text class="q" x="44.00" y="167.60">64.0 × 64.8 mm · 1º: no fundo do corpo</text>
<text class="p" x="111.00" y="163.60">TETO DA TAMPA</text>
<text class="q" x="111.00" y="167.60">64.0 × 64.8 mm · 1º: no teto da tampa</text>
<text class="t" x="154.0" y="135.2">Tecido: feltro adesivo de 1 mm (espessura 1 mm)</text>
<text class="t" x="154.0" y="140.2">Interior da caixa: 66 × 66.8 mm</text>
<text class="t" x="154.0" y="145.2">Vermelho = corte. Todas as peças: lado do adesivo para a parede.</text>
<text class="t" x="154.0" y="150.2">Ordem: fundo / teto, depois frente e traseira, por último as laterais.</text>
<text class="t" x="154.0" y="155.2">As paredes param 0,5 mm antes do topo do lábio e do degrau</text>
<text class="t" x="154.0" y="160.2">da tampa: não cubra essas faces, é onde ficam os ímãs.</text>
<text class="t" x="154.0" y="165.2">Sem adesivo no tecido? Use cola spray ou fita dupla face fina.</text>
