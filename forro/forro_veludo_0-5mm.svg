<text class="q" x="250.30" y="116.10">65.4 × 26.2 mm · 3º: entre frente e traseira</text>
<text class="p" x="44.00" y="164.60">FUNDO</text>
<text class="q" x="44.00" y="168.60">64.0 × 64.8 mm · 1º: no fundo do corpo</text>
<text class="p" x="111.00" y="164.60">TETO DA TAMPA</text>
<text class="q" x="111.00" y="168.60">64.0 × 64.8 mm · 1º: no teto da tampa</text>
<text class="t" x="154.0" y="136.2">Tecido: veludo / flocado adesivo de 0,5 mm (espessura 0.5 mm)</text>
<text class="t" x="154.0" y="141.2">Interior da caixa: 66 × 66.8 mm</text>
<text class="t" x="154.0" y="146.2">Vermelho = corte. Todas as peças: lado do adesivo para a parede.</text>
<text class="t" x="154.0" y="151.2">Ordem: fundo / teto, depois frente e traseira, por último as laterais.</text>
<text class="t" x="154.0" y="156.2">As paredes param 0,5 mm antes do topo do lábio e do degrau</text>
<text class="t" x="154.0" y="161.2">da tampa: não cubra essas faces, é onde ficam os ímãs.</text>
<text class="t" x="154.0" y="166.2">Sem adesivo no tecido? Use cola spray ou fita dupla face fina.</text>
