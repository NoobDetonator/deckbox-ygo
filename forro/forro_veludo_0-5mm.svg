<g inkscape:groupmode="layer" inkscape:label="Textos" id="textos"><text class="p" x="44.80" y="59.00">CORPO frente/traseira</text>
<text class="q" x="44.80" y="63.00">65.6 × 66.0 mm · 2º: largura toda</text>
<text class="p" x="113.40" y="59.00">CORPO frente/traseira</text>
<text class="q" x="113.40" y="63.00">65.6 × 66.0 mm · 2º: largura toda</text>
<text class="p" x="181.90" y="59.00">CORPO lateral</text>
<text class="q" x="181.90" y="63.00">65.4 × 66.0 mm · 3º: entre frente e traseira</text>
