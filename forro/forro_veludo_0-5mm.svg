<text class="q" x="250.30" y="63.00">65.4 × 66.0 mm · 3º: entre frente e traseira</text>
<text class="p" x="44.80" y="112.10">TAMPA frente/traseira</text>
<text class="q" x="44.80" y="116.10">65.6 × 26.2 mm · 2º: largura toda</text>
